  - id: Base-All-Transaction-054
    item_name: 查询工具与外部查询区分检查
    layer: semantic
    document_types: [function_breakdown]
    description: |
      请勿将查询工具与外部查询混淆。外部查询是对特定数据的直接查询操作，通常使用单键即可完成。另一方面，查询工具是由外部输入、输出和查询组成的组织结构，其目的是为了能够用多个键和操作组成若干查询。FPA 将这种组织结构视为一种应用程序，因此应单独计数。在这种情况下，只准许对外部输入、输出和查询进行计数。
    pass_criteria: |
      验证通过：查询工具(由EI/EO/EQ组成的组织结构)已作为应用程序单独计数，未与外部查询(特定数据的直接查询)混淆
    fail_criteria: |
      验证不通过：查询工具被错误计为单个EQ，或外部查询被错误计为查询工具
    severity: error
    scope: [engineering, new_demand]
    references:
