version: "3.0.0"
group: Base-All-Transaction


rules:
  - id: Base-All-Transaction-012
    item_name: 基本过程识别规则检查
    layer: semantic
    document_types: [function_breakdown]
    description: |
      识别的功能必须是一个基本过程。
      1、当满足以下两个条件时,一个功能被看作一个基本过程:
      a) 功能对用户具有独立存在的意义,并且执行一个完整的信息处理过程。换句话说,功能是自包含的。
      b)功能执行完毕后,应用程序处于稳定状态。
      2、需要细分需求，不能将子系统、模块等过大的功能单元作为基本过程，需细分到增、删、修改、查询级别；
      3、必须站在用户的业务视角而非技术视角，必须属于用户需求，超出用户需要的、镀金的需求不应计数；
      4、不可过分拆分功能，一个完整的提交-处理过程不能分拆；
      5、在之前或之后不需要任何的启动、验证、完成等操作，装载、格式检查、出错提示等均不属于基本过程；
      6、操作有结果(成功/失败)、数据完整稳定，操作人员可转其他操作，掉电/重启不会丢失数据；
      7、基本过程应包含从开始到结束所遇到的所有正常和异常情况，审核通过/不通过、录入数据的存在/不存在判断，均属于同一个基本过程，不能拆分；
      8、多步骤录入数据若仅有一处提交，所有步骤服务于一个基本过程，计为一个外部输出，不能按步骤拆分计数
      9、程序的步骤、出错、提示、校验、*检查……等不属于基本过程，基本过程有完整性要求，如：选择、校验、数据拼接，解析、清洗、操作日志、操作提醒等操作往往依赖于一个基本过程的分步骤，不能识别为独立的功能过程。
      10、不能按照步骤拆分、数据分类拆分、输入和响应拆分、字段拆分
    pass_criteria: |
      验证通过：每个识别的功能均满足基本过程条件——对用户有独立存在意义、执行完整信息处理过程、执行完毕后应用处于稳定状态；功能已细分到增删改查级别，未将子系统/模块作为基本过程；站在用户业务视角识别，功能自包含且完整
    fail_criteria: |
      验证不通过：存在识别的功能不满足基本过程条件——功能过大(子系统/模块级别)、过分拆分(完整提交过程被拆分)、站在技术视角、缺少完整性(如将校验/提示/选择等步骤独立计数)
    severity: error
    scope: [engineering, new_demand]
    references:
      - GB-T42588-2023.md §9.1 定义外部输入
      - GB-T42588-2023.md §9.2.1
      - GB-T42588-2023.md §9.2.10
      - GB-T42588-2023.md §10.1 定义外部输出
      - GB-T42588-2023.md §10.2.1
      - GB-T42588-2023.md §11.1 定义外部查询
    example: |
      例如,用户输入新员工信息时,包括该员工的薪资数据及其家庭状况信息的输入。从用户角度看,输入员工信息是一个完整的过程,输入薪资和家庭状况信息是此过程的一部分,并非分开进行。
      例如,用户要求在输入员工姓名时应记录员工的薪资数据,仅输入员工的姓名或员工的薪资数据将导致应用程序处于不稳定状态。
      示例：用户、角色管理需拆分为用户管理、角色管理，再进一步拆分为增删改查的最小单元
      示例：工作流引擎的定义工作流程功能，若超出用户公文审核的需求，不应计算为基本过程
      示例：修改员工信息的姓名、地址、联系方式，属于一个完整的员工修改功能，不能拆分为三个独立的基本过程
      示例：项目活动工作量填报前的数据检测，属于填报功能的一部分，不能独立计数为基本过程
      示例：Powerpoint插入图形的所有设置步骤，只有保存后才进入稳定状态，整体计为一个基本过程
    type_modify: ""
    reusability_modify: ""
    change_modify: ""
    function_point_count: 如果验证不通过，功能点取值为0
  - id: Base-All-Transaction-013
    item_name: 同一功能不重复计数检查
    layer: semantic
    document_types: [function_breakdown]
    description: |
      在一个应用程序中，一个功能只能被计数一次，无论是被一位或是多位用户使用，无论该功能出现在应用程序的一处或者是多处位置。这样确保一个特定的逻辑文件在一个应用程序中只会被计数一次：要么作为内部逻辑文件、要么作为外部逻辑文件，但不
      能同时作为两者计数。
    pass_criteria: |
      验证通过：同一功能在应用程序中仅被计数一次，无论被多少用户使用或出现在多少处位置；同一逻辑文件仅作为ILF或EIF之一计数
    fail_criteria: |
      验证不通过：存在同一功能在应用程序中重复计数(如不同角色/权限/入口的相同功能被多次计数)
    severity: error
    scope: [engineering, new_demand]
    references:
      - GB-T42588-2023.md §6.3 不重复计算
    example: |
      例如：
      (1)不同的角色执行相同的功能，例如：管理员登录和操作员登录；
      (2)不同的权限执行相同的功能，例如：地市管理员查询资源报表，区县管理员查询资源报表；
      (3)在不同的页面，有链接跳转到同一功能，例如：在资源管理页面点击板卡查看按钮可跳转到板卡信息页面查看板卡信息，在设备管理页面点击板卡查看按钮可跳转到板卡信息页面查看板卡信息。
    type_modify: ""
    reusability_modify: ""
    change_modify: ""
    function_point_count: 如果验证不通过，功能点取值为0
  - id: Base-All-Transaction-014
    item_name: 多端功能重用程度计取规则检查
    layer: semantic
    document_types: [function_breakdown]
    description: |
      当通过不同介质向相同的逻辑处理输入数据时，计为一个外部输入。
    pass_criteria: |
      验证通过：当通过不同介质向相同的逻辑处理输入数据时，计为一个外部输入。
    fail_criteria: |
      验证不通过：当通过不同介质向相同的逻辑处理输入数据时，计为多个外部输入。
    severity: error
    scope: [engineering, new_demand]
    references:
      - GB-T42588-2023.md §9.2.21
    example: ""
    type_modify: ""
    reusability_modify: ""
    change_modify: ""
    function_point_count: 如果验证不通过，功能点取值为0
  - id: Base-All-Transaction-015
    item_name: 控制信息不计为单独功能检查
    layer: semantic
    document_types: [function_breakdown]
    description: |
      用于控制外部输入、输出或查询的输入数据 (如选择数据) 不算作单独的功能，而是算作所涉及功能的一部分。
    pass_criteria: |
      验证通过：用于控制EI/EO/EQ的选择数据(如筛选条件、排序要求)已作为所涉及功能的一部分，未计为单独功能
    fail_criteria: |
      验证不通过：存在控制信息(如选择数据、排序要求)被错误计为单独功能
    severity: error
    scope: [engineering, new_demand]
    references:
      - GB-T42588-2023.md §9.2.19
    example: ""
    type_modify: ""
    reusability_modify: ""
    change_modify: ""
    function_point_count: 如果验证不通过，功能点取值为0
  - id: Base-All-Transaction-016
    item_name: 技术性功能不计数检查
    layer: semantic
    document_types: [function_breakdown]
    description: |
      由于技术原因 (如所使用的技术) 而专门引入但非用户要求的EI/EO/EQ，不计为外部输入。
    pass_criteria: |
      验证通过：所有因技术原因引入但非用户要求的EI/EO/EQ均未计为功能点
    fail_criteria: |
      验证不通过：存在因技术原因引入但非用户要求的EI/EO/EQ被错误计为功能点
    severity: error
    scope: [engineering, new_demand]
    references:
      - GB-T42588-2023.md §9.2.11
    example: ""
    type_modify: ""
    reusability_modify: ""
    change_modify: ""
    function_point_count: 如果验证不通过，功能点取值为0
  - id: Base-All-Transaction-017
    item_name: 事务文件校验数据计数检查
    layer: semantic
    document_types: [function_breakdown]
    description: |
      如果在事务文件中出现带有校验数据的头记录和 / 或尾记录 (例如，总数或记录总数)，则这些记录的处理不会计为单独的外部输入/外部输出。但是，校验数据会被计为数据元素类型 (如果用户要求)。
    pass_criteria: |
      验证通过：事务文件中校验数据的头/尾记录未计为单独的EI/EO，但用户要求的校验数据已计为DET
    fail_criteria: |
      验证不通过：事务文件的校验头/尾记录被错误计为单独的EI/EO，或用户要求的校验数据未计为DET
    severity: error
    scope: [engineering, new_demand]
    references:
      - GB-T42588-2023.md §9.2.23
    example: ""
    type_modify: ""
    reusability_modify: ""
    change_modify: ""
    function_point_count: 如果验证不通过，功能点取值为0
  - id: Base-All-Transaction-018
    item_name: EI类别与功能描述一致性检查
    layer: semantic
    document_types: [function_breakdown]
    description: |
      当类别是EI的时候，功能必须符合EI定义。
      EI的定义如下：
      1、外部输入(EI)必须是被用户识别和认可的。
      2、EI的处理过程包括：来自应用程序外部的数据和/或控制信息被输入到应用程序中，并且对一个或多个内部逻辑文件进行新增、更改或删除操作。
      a)一定有来自应用程序外部(用户直接输入/其他程序)的数据和/或控制信息被输入到应用程序中,跨越应用程序的外部边界。
      b)会对一个或多个内部逻辑文件进行新增、更改或删除操作
    pass_criteria: |
      验证通过：类别为EI的功能均符合EI定义——数据/控制信息从应用边界外输入，并对一个或多个ILF进行新增/更改/删除操作
    fail_criteria: |
      验证不通过：存在类别为EI的功能不符合EI定义——缺少外部数据输入或未对ILF进行维护操作
    severity: error
    scope: [engineering, new_demand]
    references:
      - GB-T42588-2023.md §9.1 定义外部输入
      - GB-T42588-2023.md §9.2.1
      - GB-T42588-2023.md §9.2.12
    example: ""
    type_modify: 根据功能描述和功能名称判定该功能属于哪种类别，如果自主判定的类别取值低于原本类别取值，在计算功能点时，则以自主判定的为准；如果自主判定的类别取值高于原本取值，则保持原本类别取值不变。
    reusability_modify: ""
    change_modify: ""
    function_point_count: ""
  - id: Base-All-Transaction-019
    item_name: EO类别与功能描述一致性检查
    layer: semantic
    document_types: [function_breakdown]
    description: |
      当类别是EO的时候，功能必须符合EO的定义。
      EO的定义如下：
      1、外部输出(EO)必须是被用户识别和认可的。
      2、外部输出既包括以报表和消息的形式直接提供给用户的输出产品,也包括通过在线链接或输出文件发送给其他应用程序的数据流。对于外部输出,仅输出产品的域是固定的,但是,输出产品的规模不一定是恒定的,这一点与外部查询中输出产品的规模是固定的不同。
      3、数据规模大小不等,或者需要进一步的数据处理。
      4、跨越应用程序边界
    pass_criteria: |
      验证通过：类别为EO的功能均符合EO定义——输出产品跨越应用边界、输出规模大小不等或需要进一步数据处理；功能点计数项名称满足唯一、无标点、直白易懂、长度≤50字符、逻辑一致的要求
    fail_criteria: |
      验证不通过：存在类别为EO的功能不符合EO定义，或功能点计数项名称存在重复、有标点、不易懂、长度>50字符或逻辑不一致的问题
    severity: error
    scope: [engineering, new_demand]
    references:
      - GB-T42588-2023.md §10.1 定义外部输出
      - GB-T42588-2023.md §10.2.1
      - GB-T42588-2023.md §10.2.2
    example: ""
    type_modify: 根据功能描述和功能名称判定该功能属于哪种类别，如果自主判定的类别取值低于原本类别取值，在计算功能点时，则以自主判定的为准；如果自主判定的类别取值高于原本取值，则保持原本类别取值不变。
    reusability_modify: ""
    change_modify: ""
    function_point_count: ""
  - id: Base-All-Transaction-020
    item_name: EO与EQ区分判定检查
    layer: semantic
    document_types: [function_breakdown]
    description: |
      当类别是EO时，解析功能描述，判定功能到底是EO还是EQ,禁止将EQ功能标记为EO。使用以下标准来区分外部输出(EO)和外部查询(EQ)：a) 外部输出的输出规模大小不等；b) 外部输出不需要输入即可选择数据；c) 外部输出的输出可能包含通过进一步数据处理 (如数据计算) 产生的数据。
    pass_criteria: |
      验证通过：正确区分EO与EQ——EO的输出规模大小不等、不需要输入即可选择数据、输出可能包含进一步数据处理产生的衍生数据；EQ功能未被错误标记为EO
    fail_criteria: |
      验证不通过：存在EQ功能被错误标记为EO，或EO/EQ的区分判定不符合五条准则要求
    severity: error
    scope: [engineering, new_demand]
    references:
      - GB-T42588-2023.md §10.2.3
    example: ""
    type_modify: 根据功能描述和功能名称判定该功能属于哪种类别，如果自主判定的类别取值低于原本类别取值，在计算功能点时，则以自主判定的为准；如果自主判定的类别取值高于原本取值，则保持原本类别取值不变。
    reusability_modify: ""
    change_modify: ""
    function_point_count: ""
  - id: Base-All-Transaction-021
    item_name: EQ类别与功能描述一致性检查
    layer: semantic
    document_types: [function_breakdown]
    description: |
      当类别选择EQ的时候，功能必须符合EQ的定义。
      EQ的定义如下：
      1、外部查询(EQ)必须是被用户识别和认可的。
      2、独特的输入/输出组合
      3、应用程序发布一个规模明确的、不需要进一步数据处理的输出,作为输入的结果。
      4、外部查询输入部分的数据应能够唯一地标识所需的输出。
      5、此外,输出的规模应完全明确。
    pass_criteria: |
      验证通过：类别为EQ的功能均符合EQ定义——独特的输入/输出组合、输出规模明确、不需要进一步数据处理；功能点计数项名称满足唯一、无标点、直白易懂、长度≤50字符、逻辑一致的要求
    fail_criteria: |
      验证不通过：存在类别为EQ的功能不符合EQ定义，或功能点计数项名称存在重复、有标点、不易懂、长度>50字符或逻辑不一致的问题
    severity: error
    scope: [engineering, new_demand]
    references:
      - GB-T42588-2023.md §11.1 定义外部查询
    example: |
      示例：人事系统中依据身份证号查询个人基本信息并展示，属于一对一查询，无数据处理，计为EQ
    type_modify: 根据功能描述和功能名称判定该功能属于哪种类别，如果自主判定的类别取值低于原本类别取值，在计算功能点时，则以自主判定的为准；如果自主判定的类别取值高于原本取值，则保持原本类别取值不变。
    reusability_modify: ""
    change_modify: ""
    function_point_count: ""
  - id: Base-All-Transaction-022
    item_name: EQ五项条件满足检查
    layer: semantic
    document_types: [function_breakdown]
    description: |
      当类别是EQ的时候，该功能必须满足以下条件：a) 外部查询输出的规模大小应明确；b) 外部查询的输入应包含一个唯一标识的查询参数；c) 外部查询的输出不应包含由进一步的数据处理而产生的数据；d) 执行外部查询时，不应维护内部逻辑文件。
    pass_criteria: |
      验证通过：类别为EQ的功能同时满足——输出规模大小明确、输入包含唯一标识的查询参数、输出不含进一步数据处理产生的衍生数据、执行时不维护ILF
    fail_criteria: |
      验证不通过：存在类别为EQ的功能不满足五项条件之一——输出规模不明确、输入无唯一标识查询参数、输出含衍生数据、执行时维护了ILF
    severity: error
    scope: [engineering, new_demand]
    references:
      - GB-T42588-2023.md §11.2.9
    example: ""
    type_modify: 根据功能描述和功能名称判定该功能属于哪种类别，如果自主判定的类别取值低于原本类别取值，在计算功能点时，则以自主判定的为准；如果自主判定的类别取值高于原本取值，则保持原本类别取值不变。
    reusability_modify: ""
    change_modify: ""
    function_point_count: ""
  - id: Base-All-Transaction-023
    item_name: EI独特性判定检查
    layer: semantic
    document_types: [function_breakdown]
    description: |
      下列情况中,外部输入宜被视为独特的:
      a) 由一组不同于所有其他外部输入的数据元素类型组成;
      b) 由一组相同的数据元素类型组成,但需要不同的逻辑处理方式。
      逻辑处理方式是以用户指定的某种方法获取所需的结果。这意味着以下内容会涉及外部输入:
      a) 维护并可能引用逻辑文件。例如,添加新订单时,引用逻辑文件“产品”以查看产品是否可被订购;
      b) 执行算法、计算和验证。例如,添加新订单时,逻辑处理包括验证(含其他事项),以确定输入的数据是否正确。
      下列情况中,逻辑处理方式会有所不同:
      a) 维护或引用其他逻辑文件;
      b) 维护相同的内部逻辑文件,但是有不同的算法,计算和(或)验证。
    pass_criteria: |
      验证通过：EI被正确判定为独特——DET集合不同或逻辑处理方式不同(维护/引用的逻辑文件不同，或算法/计算/验证不同)
    fail_criteria: |
      验证不通过：存在应判定为独特的EI被合并，或不应判定为独特的EI被分拆
    severity: error
    scope: [engineering, new_demand]
    references:
      - GB-T42588-2023.md §9.1 定义外部输入
      - GB-T42588-2023.md §9.2.1
    example: 1、一个功能是“系统租户一键启用”，另一个功能是“系统租户一键禁用”，像这种成对的启用/停用功能应该算一个功能而不是两个功能
    type_modify: ""
    reusability_modify: ""
