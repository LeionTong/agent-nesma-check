  - id: Base-All-Transaction-051
    item_name: EQ独特性判定检查
    layer: semantic
    document_types: [function_breakdown]
    description: |
      下列情况下外部查询应被视为独特的:
      a) 外部查询的输入部分由一组不同于所有其他外部查询的输入部分的数据元素类型集组成;
      b) 外部查询生成的输出产品与所有其他外部查询的输出部分所包含的数据元素类型集不同;
      c) 输入部分和输出产品两者的数据元素类型集相同,但外部查询需要不同的逻辑处理方式。
      外部查询的逻辑处理方式是以用户指定的某种方法获得所需的结果。以下内容将涉及外部查询:
      a) 引用逻辑文件。例如:显示员工数据时,将引用逻辑文件“员工信息”;
      b) 验证。例如:在查询员工信息时,应用程序会检查用户是否已被授权查询此信息。
      以下情况,逻辑处理方式会有所不同:
      a) 引用其他逻辑文件;
      b) 引用了相同的逻辑文件,但是还有其他验证。
    pass_criteria: |
      验证通过：EQ被正确判定为独特——输入部分DET集不同、或输出部分DET集不同、或逻辑处理方式不同(引用不同逻辑文件或验证不同)
    fail_criteria: |
      验证不通过：存在应判定为独特的EQ被合并，或不应判定为独特的EQ被分拆
    severity: error
    scope: [engineering, new_demand]
    references:
      - GB-T42588-2023.md §11.1 定义外部查询
    example: 1、支持按小区地址**中文名称，全拼，首字母**模糊检索，匹配相似地址并返回信息，这算一个功能，不能按照**中文名称，全拼，首字母**拆为3个功能
    type_modify: ""
    reusability_modify: ""
    change_modify: ""
    function_point_count: 如果验证不通过，功能点取值为0
