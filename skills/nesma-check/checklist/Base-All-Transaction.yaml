  - id: Base-All-Transaction-062
    item_name: 数据清理功能计数检查
    layer: semantic
    document_types: [function_breakdown]
    description: |
      系统定期或在线启动对**业务逻辑**数据的清除或归档才计为EI,对纯后台自动、技术运维、临时缓存、界面清空、数据库底层自动回收类清理一律不计 EI。一个清理过程，清理的数据可能包括多个逻辑文件，但只计为一个EI，而不是对每个内部逻辑文件都记一次EI
    pass_criteria: |
      验证通过：系统定期/在线启动的业务逻辑数据清除/归档已计为EI(一个清理过程计1个EI)；纯后台自动/技术运维/临时缓存/界面清空/数据库底层自动回收类清理均未计为EI
    fail_criteria: |
      验证不通过：业务数据清理未计为EI，或纯技术类清理被错误计为EI，或一个清理过程被按ILF数量分拆计数
