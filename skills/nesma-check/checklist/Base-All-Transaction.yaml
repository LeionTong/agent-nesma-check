  - id: Base-All-Transaction-035
    item_name: EO独特性判定检查
    layer: semantic
    document_types: [function_breakdown]
    description: |
      下列情况中,外部输出应被视为独特的:
      a) 输出产品的逻辑布局与所有其他输出产品不同;
      b) 输出产品具有相同的逻辑布局,但是需要不同的逻辑处理方式;
      c) 与所有其他外部输出的输入部分相比,外部输出的任何输入部分都包含一组不同的数据元素类型。
      输出产品具有相同的逻辑布局,如果其数据元素类型集是相同的,则下列情况是允许的:
      a) 以不同的顺序输出产品数据元素类型;
      注:以不同方式(如,通过中间标题)对数据元素类型进行分组,视为不同的逻辑布局。
      b) 输出产品中出现数据元素类型,却没有赋值,原因可能如下:
      1) 数据元素类型在逻辑文件中没有值(因此,数据元素类型不可见);
      2) 数据元素类型在逻辑文件中确实有值,但与用户无关。
      外部输出的逻辑处理方式是以用户指定的某种方法获得所需的结果。以下内容会涉及外部输出。
      a) 引用逻辑文件。例如,输出员工列表时,将引用逻辑文件“员工信息”。
      b) 提供进一步的数据处理,如算法、计算和/或验证。
      例如,当报告组织中的所有员工信息时,逻辑处理方式包含计算固定员工、小时工和所有员工总数所需的算法。
      在以下情况,逻辑处理方式会有所不同:
      a) 引用其他逻辑文件;
      b) 引用了相同的逻辑文件,但存在其他算法、计算或验证。
      使用不同的选择值进行选择(无论是否使用不同种类的通配符)和在同一字段上进行选择但使用不同的运算符,视为相同的逻辑处理方式。
      为实现相同的逻辑处理而选择不同的技术解决方案,也不意味着逻辑处理方式是不同的。
    pass_criteria: |
      验证通过：EO被正确判定为独特——逻辑布局不同、或逻辑处理方式不同(引用不同逻辑文件或算法/计算/验证不同)、或输入部分DET集合不同；仅排序顺序不同或同一字段不同运算符视为相同处理方式
    fail_criteria: |
      验证不通过：存在应判定为独特的EO被合并，或不应判定为独特的EO被分拆
    severity: error
    scope: [engineering, new_demand]
    references:
      - GB-T42588-2023.md §10.1 定义外部输出
      - GB-T42588-2023.md §10.2.1
    example: ""
    type_modify: ""
    reusability_modify: ""
    change_modify: ""
    function_point_count: 如果验证不通过，功能点取值为0
