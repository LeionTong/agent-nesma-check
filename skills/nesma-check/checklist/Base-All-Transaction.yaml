  - id: Base-All-Transaction-058
    item_name: 帮助功能识别与计数检查
    layer: semantic
    document_types: [function_breakdown]
    description: |
      帮助功能通常将其识别为EQ。此外避免重复识别帮助功能。考虑以下情况:如果在每个屏幕或窗口都可调用的帮助信息,那么只能将其整体计数为应用程序的一个外部查询。总的来说,在被计数的应用程序中有多少种帮助功能,就最多有多少个外部查询。
    pass_criteria: |
      验证通过：帮助功能已正确识别为EQ；每个屏幕/窗口可调用的帮助信息已整体计为1个EQ；帮助功能无重复计数
    fail_criteria: |
      验证不通过：帮助功能未正确识别为EQ，或存在重复计数(如每个窗口的帮助均单独计数)
    severity: error
    scope: [engineering, new_demand]
    references:
      - GB-T42588-2023.md §6.13
    example: ""
