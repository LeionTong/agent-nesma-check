    description: |
      计算机系统消息是由操作系统或其他系统软件生成,这些消息不纳入功能点计数。
      一个系统中，供多个事务功能调用或同一事务功能反复调用的功能消息(例如日志报告或错误报告)作为一个外部输出统一计数，不能再重复计数。
    pass_criteria: |
      验证通过：操作系统/系统软件生成的消息未纳入计数；供多个事务功能调用的功能消息(如日志报告/错误报告)已作为一个EO统一计数，无重复
    fail_criteria: |
      验证不通过：操作系统消息被错误纳入计数，或功能消息被重复计数
    severity: error
    scope: [engineering, new_demand]
    references:
      - GB-T42588-2023.md §6.14
