      外部查询的输入部分仅配合查询操作，而不会维护内部逻辑文件。如果该功能中出现了维护内部逻辑文件，则该功能不是EQ。
    pass_criteria: |
      验证通过：类别为EQ的功能的输入部分仅配合查询操作，未对任何ILF进行维护；若功能中出现了ILF维护，则该功能已正确判定为非EQ
    fail_criteria: |
      验证不通过：存在类别为EQ的功能中出现了ILF维护操作，但仍被标记为EQ
    severity: error
    scope: [engineering, new_demand]
