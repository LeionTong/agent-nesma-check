  - id: Base-All-Transaction-061
    item_name: 菜单结构计数检查
    layer: semantic
    document_types: [function_breakdown]
    description: |
      菜单结构通常不纳入功能点计数。然而,对于每一个被识别的事务功能的启动,不论在菜单结构中需要多少实际的步骤数量,按一个数据元素类型进行计数。如果用户自己可维护菜单结构和文本,则根据计算逻辑文件和外部输入的准则进行计数。
    pass_criteria: |
      验证通过：菜单结构未纳入功能点计数；每个被识别事务功能的启动已按1个DET计数；用户可维护的菜单结构已按逻辑文件和EI准则计数
    fail_criteria: |
      验证不通过：菜单结构被错误纳入功能点计数，或事务功能启动DET计数不正确
    severity: error
    scope: [engineering, new_demand]
    references:
      - GB-T42588-2023.md §6.15
