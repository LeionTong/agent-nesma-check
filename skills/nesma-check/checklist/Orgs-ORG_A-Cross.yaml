  - id: Orgs-ORG_A-Cross-137
    item_name: 需求说明书与汇报PPT架构图一致性检查
    layer: programmatic
    document_types: [srs, ppt]
    description: |
      汇报PPT中的架构图必须和需求说明书中的架构图一致
