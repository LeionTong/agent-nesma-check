      验证通过：NESMA拆分表一级/二级模块/功能点计数项名称与需求说明书对应目录层级一一对应
    fail_criteria: |
      验证不通过：NESMA拆分表各层级与需求说明书目录对应关系不匹配
    severity: error
    scope: [engineering, new_demand]
