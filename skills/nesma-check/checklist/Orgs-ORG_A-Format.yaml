  - id: Orgs-ORG_A-Format-124
    item_name: NESMA拆分表类别取值检查(GD版)
    layer: programmatic
    document_types: [function_breakdown]
    description: |
      《NESMA拆分表》中，【类型】列的取值必须是：ILF/ELF(EIF)/EI/EO/EQ(不区分大小写)之一
    pass_criteria: |
      验证通过：《NESMA拆分表》中【类别】列的取值均为ILF/ELF(EIF)/EI/EO/EQ之一(不区分大小写)
    fail_criteria: |
      验证不通过：《NESMA拆分表》中【类别】列存在不在规定范围内的取值
    severity: error
