  - id: Orgs-ORG_A-Format-122
    item_name: 测试报告功能截图完整性与一致性检查
    layer: semantic
    document_types: [test_report]
    description: |
      测试报告中的每个【功能点】必须有对应截图，截图要求为：
      1、概详设中这个功能用了几个表，测试报告对应该功能点就要截图几个表的数据库查询结果，呼应一致，
      2、截图的字段数量要大于概详设，比如某个表，概详设写了4个字段，那截图出来的字段要大于4个，包住它
      3、页面截图、数据库截图，功能描述，这三个要逻辑一致，要匹配。比如入库类的功能，要截图insert into类的后台日志，包括数据库可以查到这笔记录；导出类的功能，要把导出的文件打开截图
      4、页面截图，别把整个窗口都截了，尽量少截点，能看出来符合就可以了，少暴漏
    pass_criteria: |
      验证通过：测试报告中每个功能点均有对应截图；截图页面内容与功能描述、需求说明一致；非界面功能截图已替换为对应代码或查询结果截图
    fail_criteria: |
      验证不通过：测试报告存在功能点无截图、截图内容与描述不一致，或非界面功能截图方式不符合要求
    severity: error
    scope: [engineering, new_demand]
    references: []
    example: ""
    type_modify: ""
    reusability_modify: ""
    change_modify: ""
    function_point_count: ""
