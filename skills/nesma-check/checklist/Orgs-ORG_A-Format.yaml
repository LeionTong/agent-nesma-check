  - id: Orgs-ORG_A-Format-130
    item_name: 前评估阶段业务需求内容格式合规性检查
    layer: semantic
    document_types: [function_breakdown]
    description: |
      在前后评估阶段，NESMA拆分表的【前后评估明细】sheet页，【输入输出(前后评估需要)】列的内容格式必须是：
      表中文名称1{输入字段名称|输出字段名称}
      表中文名称2{输入字段名称|输出字段名称}
    pass_criteria: |
      验证通过：NESMA拆分表【前评估业务需求】sheet中，业务需求内容格式为规范格式
    fail_criteria: |
      验证不通过：【前评估业务需求】中业务需求内容格式不符合规范要求
