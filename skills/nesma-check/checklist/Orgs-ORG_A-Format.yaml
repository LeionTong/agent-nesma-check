    example: ""
    type_modify: ""
    reusability_modify: ""
    change_modify: ""
    function_point_count: ""
  - id: Orgs-ORG_A-Format-125
    item_name: NESMA拆分表功能点计数项名称合规性检查(GD版)
    layer: semantic
    document_types: [function_breakdown]
    description: |
      《NESMA拆分表》的【四级模块】列必须满足以下要求
      1、不能出现标点符号，保证功能点计数项名称是一个短语而不是一段话。
      2、要求描述语言直白，见名知意，长度 ≤50 字符
      3、要和功能项描述的内容逻辑一致，说的是同一个功能。
      4、必须说明该功能本期属性是【新增】、【更新】，【删除】
    pass_criteria: |
      验证通过：功能点计数项名称无标点符号、直白见名知意、长度≤50字符、与功能描述逻辑一致
    fail_criteria: |
      验证不通过：功能点计数项名称存在标点、不易懂、超长或逻辑不一致
    severity: error
    scope: [engineering, new_demand]
    references: []
    example: ""
    type_modify: ""
    reusability_modify: ""
    change_modify: ""
    function_point_count: ""
  - id: Orgs-ORG_A-Format-126
    item_name: NESMA拆分表功能项描述合规性检查(GD版)
    layer: semantic
    document_types: [function_breakdown]
    description: |
      《NESMA拆分表》的【功能描述】列必须满足以下要求：
      1、避免直接复制功能项计数点名称的内容。
      2、避免过于简单，缺少具体业务场景描述。
      3、建议字数在20字以上。
      4、描述要和功能点计数项名称的内容逻辑一致，不能功能点计数项名称是新增，功能项描述是导出。
    pass_criteria: |
      验证通过：功能项描述未直接复制名称、有具体业务场景、字数≥20字、与名称逻辑一致
    fail_criteria: |
      验证不通过：功能项描述直接复制名称、无业务场景、字数<20字或逻辑不一致
    severity: error
    scope: [engineering, new_demand]
    references: []
    example: ""
    type_modify: ""
    reusability_modify: ""
    change_modify: ""
    function_point_count: ""
