    pass_criteria: |
      验证通过：所有功能项描述未直接复制功能点计数项名称、有具体业务场景描述、字数≥20字、与功能点计数项名称逻辑一致
    fail_criteria: |
      验证不通过：存在功能项描述直接复制名称、过于简单无业务场景、字数<20字、或与名称逻辑不一致
