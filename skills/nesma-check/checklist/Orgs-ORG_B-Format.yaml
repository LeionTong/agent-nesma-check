  - id: Orgs-ORG_B-Format-096
    item_name: 优化功能修改类型与重用程度取值检查
    layer: programmatic
    document_types: [function_breakdown]
    description: |
      《NESMA拆分表》的【规模估算】sheet中，
      如果功能点计数项名称和功能项描述表达的是对以往已存在的功能的升级/优化/重构/国产化，
      那么【修改类型】只能选择【修改】，【复用程度】只能选择【高】；
      若复用程度要选择【中】的话，必须描述清楚变更或者新增的字段数量超过50%。(一般不写中(默认规则)，认可度低)
    pass_criteria: |
      验证通过：功能为对已有功能的升级/优化/重构/国产化时，【修改类型】为“修改”，【重用程度】为“高”(若为“中”则已说明变更字段数量超50%)
    fail_criteria: |
      验证不通过：优化功能的【修改类型】不为“修改”或【重用程度】不为“高”且无充分理由
    severity: error
    scope: [engineering, new_demand]
    references: []
    example: |
      示例：功能项描述列为，管理员点击同步按钮，将用户信息同步到外部人力资源系统(同步方式有FTP修改为SFTP)，功能点计数项名称列描述为，角色信息(原有字段基础上增加角色类型)
    type_modify: ""
    reusability_modify: 功能为对已有功能的升级/优化/重构/国产化时，【重用程度】为“高”
    change_modify: 功能为对已有功能的升级/优化/重构/国产化时，【修改类型】为“修改”
    function_point_count: ""
