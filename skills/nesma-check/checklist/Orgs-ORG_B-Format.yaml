    description: |
      《NESMA拆分表》的【规模估算】sheet中，【功能项描述】列必须满足以下要求：
      1、避免直接复制功能项计数点名称的内容。
      2、避免过于简单，缺少具体业务场景描述。
      3、建议字数在20字以上。
